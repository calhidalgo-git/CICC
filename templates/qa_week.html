{% extends 'base.html' %}
{% block content %}
<a href="{% url 'qa_fundamentals' %}" class="eyebrow">← VOLVER A FUNDAMENTOS QA</a>
<div class="page-heading"><div><h1>{{ week_title }}</h1><p>Fundamentos QA · Semana {{ week }} de 6</p></div></div>
<article class="panel qa-week-content">{% include week_template %}</article>
<div class="section-heading"><h2>Explorar los temas</h2></div>
{% for title in weeks %}
{% if forloop.counter != week %}<a class="resource-row" href="{% url 'qa_week' forloop.counter %}"><span class="file-icon">▤</span><div><h3>{{ title }}</h3></div><span>→</span></a>{% endif %}
{% endfor %}
{% endblock %}
