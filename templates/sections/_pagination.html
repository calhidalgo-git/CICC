{% if page_obj.paginator.num_pages > 1 %}
<nav class="pager" aria-label="Paginación">
  {% if page_obj.has_previous %}<a rel="prev" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}">← Anterior</a>{% endif %}
  <span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a rel="next" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}">Siguiente →</a>{% endif %}
</nav>
{% endif %}
