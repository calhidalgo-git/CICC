name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Estilo
        run: |
          ruff format --check config hub manage.py
          ruff check config hub manage.py
      - name: Migraciones al día
        run: python manage.py makemigrations --check --dry-run
        env:
          QA_SQLITE: '1'
      - name: Pruebas (SQLite)
        run: python manage.py test hub -v 2
        env:
          QA_SQLITE: '1'

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: qahub
          POSTGRES_PASSWORD: qahub
          POSTGRES_DB: qahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qahub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas (PostgreSQL)
        # Si falla, deja las líneas clave como anotaciones visibles en la ejecución (útil al depurar sin abrir los registros).
        run: |
          python manage.py test hub -v 2 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^(ERROR|FAIL):|Error|Exception|violates|does not exist|relation ' test.log | tail -n 15 | while IFS= read -r line; do
              line=${line//'%'/'%25'}
              echo "::error::${line:0:400}"
            done
          fi
          exit "$status"
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGDATABASE: qahub
          PGUSER: qahub
          PGPASSWORD: qahub
